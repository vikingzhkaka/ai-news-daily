name: AI 趋势雷达周报看门狗

# 周报看门狗：每周一 09:30 北京时间（01:30 UTC）检查仓库根 index.html 是否「本周已生成」。
# 自 2026-08-10 起，资讯流水线已全部合并为每周一单任务（WorkBuddy automation 1784974288542 独占，
# 负责生成根 index.html + 写 Obsidian 资讯/每周/），旧的每日 watchdog、每日 generate 已废弃，
# 本 workflow 相应从「每日查 daily/index.html」调整为「每周查根 index.html」。
# 失败时 GitHub 自动向仓库所有者发失败邮件——警报通道与生成任务解耦。
on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch: {}

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check root index.html freshness (this week)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY_BJ=$(TZ=Asia/Shanghai date +%F)
          TODAY_DOW=$(TZ=Asia/Shanghai date +%u)
          MONDAY_BJ=$(TZ=Asia/Shanghai date -d "$TODAY_BJ -$((TODAY_DOW - 1)) days" +%F)
          echo "this week's Monday (Beijing): $MONDAY_BJ / today (Beijing): $TODAY_BJ"

          LAST=$(gh api "repos/${{ github.repository }}/commits?path=index.html&per_page=1" --jq '.[0].commit.committer.date')
          echo "last commit of root index.html: $LAST"
          if [ -z "$LAST" ]; then
            echo "::error::根 index.html 从未提交过，周报流水线可能从未成功运行。"
            exit 1
          fi
          LAST_BJ=$(TZ=Asia/Shanghai date -d "$LAST" +%F)
          echo "last commit (Beijing): $LAST_BJ"

          if [[ "$LAST_BJ" < "$MONDAY_BJ" ]]; then
            echo "::error::AI 趋势雷达周报（本周一 $MONDAY_BJ 起）尚未生成——请检查 WorkBuddy 周报自动化 1784974288542 是否成功运行。"
            exit 1
          fi
          echo "OK: weekly briefing is fresh for this week (generated $LAST_BJ)."
